# On every push and pull request: the server's tests, a lint for what breaks at run time (syntax errors, undefined
# names), and every web file parsing. The same as running these locally:
#   cd server && python -m pytest -q
#   ruff check --select E9,F63,F7,F82 server
#   for f in web/*.js; do node --check "$f"; done
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # as the Docker image
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4   # the browser code's tests run in node
        with:
          node-version: "22"
      - name: Install
        run: pip install -r server/requirements.txt pytest==9.1.1 ruff==0.16.8
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 server
      - name: Web files parse
        run: for f in web/*.js; do node --check "$f"; done
      - name: Tests
        working-directory: server
        run: python -m pytest -q
